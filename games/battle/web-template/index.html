<!doctype html><html lang="ja" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>カスタムカニバトル・操作比較</title><link rel="stylesheet" href="game.css"></head>
<body data-screen="home" data-phase="customize"><main id="stage" aria-label="カスタムカニバトル 3Dアリーナ"><canvas id="unity-canvas" tabindex="0"></canvas>
<header><button id="home" class="brand" aria-label="タイトルへ戻る">カスタムカニバトル</button><div class="top-actions"><button id="sound" role="switch" aria-checked="false" aria-label="効果音">音 OFF</button><button id="options" aria-label="設定">設定</button><button id="pause" aria-label="一時停止">Ⅱ</button></div></header>
<section id="homeScreen" class="home-screen"><p class="eyebrow">剣 × 架空砲 × 生物腕</p><h1>その腕で、<br>どう戦う？</h1><p id="loadoutSummary"></p><button id="play" class="primary large" disabled>あそぶ</button><button id="openWorkshop" class="secondary">カニを組み替える</button><small>比較試作 · 装備で間合いが変わる</small></section>
<section id="tutorial" class="card centered" aria-label="はじめの操作"><p class="eyebrow">まずは、これだけ</p><h2>よけて、向き直して、反撃。</h2><div class="instruction"><b>左のスティックで移動</b><span>動いた向きへ攻撃します。</span><b>右の2ボタンで左右の腕</b><span>実線は自分、破線は相手の攻撃予測。動くと線も変わります。</span></div><button id="hintStart" class="primary large">戦う</button></section>
<aside id="workshop" class="card drawer" aria-label="パーツ換装"><div class="panel-title"><h2>腕をすげ替える</h2><button id="closeWorkshop" aria-label="換装を閉じる">閉じる</button></div><div class="arm-tabs"><button data-arm="left" aria-pressed="true">左の腕</button><button data-arm="right" aria-pressed="false">右の腕</button></div><div class="part-options"><button data-part="sword"><b>剣</b><span>近くを斬る</span></button><button data-part="cannon"><b>架空砲</b><span>向いた先へ撃つ</span></button><button data-part="creature"><b>生物腕</b><span>中距離へ伸ばす</span></button></div><p id="partHint"></p><button id="begin" class="primary large" disabled>この装備で戦う</button></aside>
<div id="hud" class="hud"><div class="health"><span>あなた <b id="hp">100</b></span><div class="bar"><i id="hpBar"></i></div></div><div class="health enemy"><span>相手 <b id="enemyHp">100</b></span><div class="bar"><i id="enemyBar"></i></div></div></div><div id="enemyIntent" class="intent" role="status"></div><div id="message" class="notice hidden" role="status"></div>
<div id="input"><div id="stick" role="region" aria-label="移動・向きスティック"><span>移動・向き</span><div id="knob"></div></div><div class="attacks"><button id="attackL" class="attack" aria-label="左の腕"><span>左 J</span><b>剣</b><small>攻撃</small></button><button id="attackR" class="attack" aria-label="右の腕"><span>右 K</span><b>架空砲</b><small>攻撃</small></button></div></div>
<section id="result" class="card result" aria-live="polite"><p class="eyebrow">ROUND RESULT</p><h2 id="resultTitle"></h2><p id="resultSummary"></p><button id="retry" class="primary large">同じ装備でもう一戦</button><button id="customize" class="secondary">1パーツ変えて試す</button><button id="resultHome" class="text-button">タイトルへ</button></section>
<div id="pauseBackdrop" class="scrim"><section class="card pause-card" aria-label="一時停止と設定"><div class="panel-title"><h2 id="pauseTitle">ひと休み</h2><button id="closeOptions" aria-label="設定を閉じる">閉じる</button></div><button id="resume" class="primary large">つづける</button><label for="volume">音量 <output id="volumeValue">45%</output></label><input id="volume" type="range" min="0" max="100" value="45"><button id="soundPause" role="switch" aria-checked="false">音 OFF</button><button id="motion" role="switch" aria-checked="false">揺れを控える</button><button id="forecast" role="switch" aria-checked="true">攻撃予測線 ON</button><p class="controls-help">線は現在の姿勢からの予測です。移動で更新し、命中は保証しません。場外の表示は省略します。<br>WASD / 矢印：移動・向き<br>J / K：左右攻撃　Esc：一時停止</p><button id="pauseHome" class="secondary">タイトルへ戻る</button></section></div>
<section id="loading" class="scrim loading" aria-live="polite"><div><p class="eyebrow">3D ARENA</p><h2>カニを準備中</h2><p id="loadText">0%</p><button id="reload" class="primary hidden">再読み込み</button></div></section><output id="uxMetrics" aria-hidden="true" class="qa-only hidden"></output>
</main><script src="qa-meta.js"></script><script src="sound.js"></script><script src="host.js"></script></body></html>
